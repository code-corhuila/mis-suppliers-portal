name: Suppliers portal checks
on:
  pull_request:
    branches: [develop, qa]
concurrency:
  group: suppliers-portal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
